<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carriup — Comparador de Precios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 { font-size: 36px; margin-bottom: 10px; }
        header p { font-size: 18px; opacity: 0.9; }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #FF6600;
            box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 102, 0, 0.3);
        }

        .products-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .product-item span { flex: 1; }
        .remove-btn {
            background: #e74c3c;
            padding: 8px 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .supermarket-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .supermarket-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .supermarket-header {
            background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .supermarket-name { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        .supermarket-logo { font-size: 40px; margin-bottom: 10px; }

        .supermarket-body {
            padding: 20px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .price-item:last-child { border-bottom: none; }
        .price-item-name { font-weight: 500; color: #333; }
        .price-item-value { font-size: 18px; font-weight: 700; color: #FF6600; }

        .total-price {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .total-price-label { font-size: 12px; color: #999; text-transform: uppercase; }
        .total-price-value { font-size: 28px; font-weight: 700; color: #FF6600; }

        .savings-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
        }

        .savings-badge.best { background: #FF6600; }

        .comparison-summary {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .summary-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 20px; }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
        }

        .summary-item:last-child { border-bottom: none; }

        .summary-item-label { font-weight: 600; color: #666; }
        .summary-item-value { font-weight: 700; color: #FF6600; }

        .recommendation {
            background: #e8f8f5;
            border-left: 4px solid #27ae60;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #155724;
        }

        .recommendation-icon { font-size: 20px; margin-right: 10px; }
        .recommendation-text { display: inline; }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state-icon { font-size: 60px; margin-bottom: 20px; }
        .empty-state-text { font-size: 18px; margin-bottom: 10px; }
        .empty-state-subtext { font-size: 14px; opacity: 0.8; }

        @media (max-width: 768px) {
            header h1 { font-size: 24px; }
            header p { font-size: 14px; }
            .results-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🛒 Carriup</h1>
            <p>Comparador de Precios Inteligente</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <h2 style="margin-bottom: 20px; color: #333;">Ingresa productos para comparar</h2>
            <div class="search-box">
                <input type="text" id="productInput" placeholder="Ej: Leche, Pan integral, Huevos..." autocomplete="off">
                <button onclick="addProduct()">Agregar</button>
            </div>

            <div class="products-list" id="productsList" style="display: none;">
                <div style="margin-bottom: 10px; font-weight: 600; color: #333;">Productos seleccionados:</div>
                <div id="productsContainer"></div>
                <button onclick="compareProducts()" style="width: 100%; margin-top: 15px;">Comparar Precios</button>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📝</div>
                <div class="empty-state-text">No hay productos seleccionados</div>
                <div class="empty-state-subtext">Ingresa al menos un producto para comenzar</div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <div class="results-section" id="resultsContainer"></div>
            <div class="comparison-summary" id="summarySection"></div>
        </div>

        <!-- Loading -->
        <div id="loadingSection" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Comparando precios en supermercados...</p>
            </div>
        </div>
    </div>

    <script>
        // Mock data for supermarkets and products
        const SUPERMARKETS = [
            { name: 'Lider', emoji: '🏪', id: 'lider' },
            { name: 'Jumbo', emoji: '🛍️', id: 'jumbo' },
            { name: 'Santa Isabel', emoji: '🏬', id: 'santa-isabel' },
            { name: 'Unimarc', emoji: '🏢', id: 'unimarc' }
        ];

        const PRODUCTS_DB = {
            'leche': [
                { supermarket: 'lider', price: 1290, brand: 'Colun' },
                { supermarket: 'jumbo', price: 1320, brand: 'Surlat' },
                { supermarket: 'santa-isabel', price: 1250, brand: 'Marca Blanca' },
                { supermarket: 'unimarc', price: 1350, brand: 'Colun Premium' }
            ],
            'pan integral': [
                { supermarket: 'lider', price: 2490, brand: 'Bimbo' },
                { supermarket: 'jumbo', price: 2290, brand: 'Artesanal' },
                { supermarket: 'santa-isabel', price: 1990, brand: 'Marca Blanca' },
                { supermarket: 'unimarc', price: 2650, brand: 'Premium' }
            ],
            'huevos': [
                { supermarket: 'lider', price: 3990, brand: 'Orgánicos' },
                { supermarket: 'jumbo', price: 3490, brand: 'Granja' },
                { supermarket: 'santa-isabel', price: 2990, brand: 'Marca Blanca' },
                { supermarket: 'unimarc', price: 4290, brand: 'Premium' }
            ],
            'arroz': [
                { supermarket: 'lider', price: 1590, brand: 'Maravilla' },
                { supermarket: 'jumbo', price: 1490, brand: 'Continente' },
                { supermarket: 'santa-isabel', price: 1290, brand: 'Marca Blanca' },
                { supermarket: 'unimarc', price: 1790, brand: 'Gourmet' }
            ],
            'aceite': [
                { supermarket: 'lider', price: 4290, brand: 'Oliva Extra' },
                { supermarket: 'jumbo', price: 4090, brand: 'Girasol' },
                { supermarket: 'santa-isabel', price: 3490, brand: 'Marca Blanca' },
                { supermarket: 'unimarc', price: 4890, brand: 'Premium' }
            ]
        };

        let selectedProducts = [];

        function addProduct() {
            const input = document.getElementById('productInput');
            const product = input.value.trim().toLowerCase();

            if (!product) {
                alert('Por favor ingresa un producto');
                return;
            }

            if (selectedProducts.includes(product)) {
                alert('Este producto ya está en la lista');
                return;
            }

            selectedProducts.push(product);
            input.value = '';
            updateProductsList();
        }

        function removeProduct(product) {
            selectedProducts = selectedProducts.filter(p => p !== product);
            updateProductsList();
        }

        function updateProductsList() {
            const container = document.getElementById('productsContainer');
            const listDiv = document.getElementById('productsList');
            const emptyState = document.getElementById('emptyState');

            if (selectedProducts.length === 0) {
                listDiv.style.display = 'none';
                emptyState.style.display = 'block';
            } else {
                listDiv.style.display = 'block';
                emptyState.style.display = 'none';

                container.innerHTML = selectedProducts.map(product => `
                    <div class="product-item">
                        <span>${product}</span>
                        <button class="remove-btn" onclick="removeProduct('${product}')">Eliminar</button>
                    </div>
                `).join('');
            }
        }

        function compareProducts() {
            if (selectedProducts.length === 0) {
                alert('Por favor selecciona al menos un producto');
                return;
            }

            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';

            // Simulate API delay
            setTimeout(() => {
                showResults();
            }, 2000);
        }

        function showResults() {
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';

            // Get products data
            const results = {};
            const productsFound = [];

            SUPERMARKETS.forEach(supermarket => {
                results[supermarket.id] = {
                    name: supermarket.name,
                    emoji: supermarket.emoji,
                    items: [],
                    total: 0
                };
            });

            selectedProducts.forEach(product => {
                const dbKey = Object.keys(PRODUCTS_DB).find(key =>
                    key.includes(product) || product.includes(key)
                );

                if (dbKey) {
                    productsFound.push(product);
                    PRODUCTS_DB[dbKey].forEach(item => {
                        results[item.supermarket].items.push({
                            name: product,
                            price: item.price,
                            brand: item.brand
                        });
                        results[item.supermarket].total += item.price;
                    });
                } else {
                    // Random price for unknown products
                    SUPERMARKETS.forEach(supermarket => {
                        const price = Math.floor(Math.random() * 5000) + 1000;
                        results[supermarket.id].items.push({
                            name: product,
                            price: price,
                            brand: 'Disponible'
                        });
                        results[supermarket.id].total += price;
                    });
                    productsFound.push(product);
                }
            });

            // Render cards
            const resultsContainer = document.getElementById('resultsContainer');
            const supermarketsArray = Object.values(results);
            const minTotal = Math.min(...supermarketsArray.map(s => s.total));
            const maxTotal = Math.max(...supermarketsArray.map(s => s.total));
            const savings = maxTotal - minTotal;

            resultsContainer.innerHTML = supermarketsArray.map(supermarket => `
                <div class="supermarket-card ${supermarket.total === minTotal ? 'best' : ''}">
                    <div class="supermarket-header">
                        <div class="supermarket-logo">${supermarket.emoji}</div>
                        <div class="supermarket-name">${supermarket.name}</div>
                    </div>
                    <div class="supermarket-body">
                        ${supermarket.items.map(item => `
                            <div class="price-item">
                                <span class="price-item-name">${item.name}</span>
                                <span class="price-item-value">$${item.price.toLocaleString()}</span>
                            </div>
                        `).join('')}
                        <div class="total-price">
                            <div class="total-price-label">Total</div>
                            <div class="total-price-value">$${supermarket.total.toLocaleString()}</div>
                        </div>
                        ${supermarket.total === minTotal ? '<div class="savings-badge best">✓ Mejor Precio</div>' : ''}
                    </div>
                </div>
            `).join('');

            // Render summary
            const summarySection = document.getElementById('summarySection');
            const bestSupermarket = supermarketsArray.reduce((prev, current) =>
                prev.total < current.total ? prev : current
            );

            summarySection.innerHTML = `
                <div class="summary-title">📊 Resumen de Comparación</div>
                <div class="summary-item">
                    <span class="summary-item-label">Productos encontrados:</span>
                    <span class="summary-item-value">${productsFound.length}/${selectedProducts.length}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Mejor supermercado:</span>
                    <span class="summary-item-value">${bestSupermarket.emoji} ${bestSupermarket.name}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Ahorro potencial:</span>
                    <span class="summary-item-value">$${savings.toLocaleString()}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Precio mínimo total:</span>
                    <span class="summary-item-value">$${minTotal.toLocaleString()}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Precio máximo total:</span>
                    <span class="summary-item-value">$${maxTotal.toLocaleString()}</span>
                </div>
                <div class="recommendation">
                    <span class="recommendation-icon">💡</span>
                    <span class="recommendation-text">
                        Compra en <strong>${bestSupermarket.name}</strong> para ahorrar <strong>$${savings.toLocaleString()}</strong>
                    </span>
                </div>
            `;
        }

        // Allow Enter key to add products
        document.getElementById('productInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addProduct();
        });

        // Initialize
        updateProductsList();
    </script>
</body>
</html>
