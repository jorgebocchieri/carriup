<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carriup — Comparador de Precios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 40px; }
        header h1 { font-size: 36px; margin-bottom: 10px; }
        header p { font-size: 18px; opacity: 0.9; }
        .server-info { background: rgba(255, 255, 255, 0.2); color: white; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; text-align: center; }
        .search-section { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: all 0.3s ease; }
        input[type="text"]:focus { outline: none; border-color: #FF6600; box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1); }
        button { padding: 12px 24px; background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 102, 0, 0.3); }
        .products-list { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); display: none; }
        .products-list.show { display: block; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; background: #f9f9f9; }
        .results-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .supermarket-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; }
        .supermarket-card:hover { transform: translateY(-5px); }
        .supermarket-header { background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%); color: white; padding: 20px; text-align: center; }
        .supermarket-name { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        .supermarket-logo { font-size: 40px; margin-bottom: 10px; }
        .supermarket-body { padding: 20px; }
        .price-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e0e0e0; }
        .price-item-name { font-weight: 500; color: #333; }
        .price-item-value { font-size: 18px; font-weight: 700; color: #FF6600; }
        .total-price { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
        .total-price-label { font-size: 12px; color: #999; text-transform: uppercase; }
        .total-price-value { font-size: 28px; font-weight: 700; color: #FF6600; }
        .savings-badge { display: inline-block; background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-top: 10px; }
        .savings-badge.best { background: #FF6600; }
        .comparison-summary { background: white; border-radius: 12px; padding: 30px; margin-top: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); display: none; }
        .comparison-summary.show { display: block; }
        .summary-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 20px; }
        .summary-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #e0e0e0; font-size: 16px; }
        .summary-item:last-child { border-bottom: none; }
        .summary-item-label { font-weight: 600; color: #666; }
        .summary-item-value { font-weight: 700; color: #FF6600; }
        .recommendation { background: #e8f8f5; border-left: 4px solid #27ae60; padding: 15px; border-radius: 8px; margin-top: 20px; color: #155724; }
        .loading { text-align: center; padding: 40px; color: white; }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-top: 3px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-message { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #f5c6cb; display: none; }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Carriup</h1>
            <p>Comparador de Precios Inteligente</p>
        </header>

        <div class="server-info">
            ⚙️ Conectado a http://localhost:3001
        </div>

        <div class="search-section">
            <h2 style="margin-bottom: 20px; color: #333;">Ingresa productos para comparar</h2>
            <div class="error-message" id="errorMessage"></div>
            <div class="search-box">
                <input type="text" id="productInput" placeholder="Ej: Leche, Pan integral, Huevos..." autocomplete="off">
                <button onclick="addProduct()">Agregar</button>
            </div>

            <div class="products-list" id="productsList">
                <div style="margin-bottom: 10px; font-weight: 600; color: #333;">Productos seleccionados:</div>
                <div id="productsContainer"></div>
                <button onclick="compareProducts()" style="width: 100%; margin-top: 15px;">Comparar Precios</button>
            </div>
        </div>

        <div id="resultsSection" style="display: none;">
            <div class="results-section" id="resultsContainer"></div>
            <div class="comparison-summary" id="summarySection"></div>
        </div>

        <div id="loadingSection" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Comparando precios en supermercados...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';
        let selectedProducts = [];

        function addProduct() {
            const input = document.getElementById('productInput');
            const product = input.value.trim().toLowerCase();

            if (!product) {
                alert('Por favor ingresa un producto');
                return;
            }

            if (selectedProducts.includes(product)) {
                alert('Este producto ya está en la lista');
                return;
            }

            selectedProducts.push(product);
            input.value = '';
            updateProductsList();
        }

        function removeProduct(product) {
            selectedProducts = selectedProducts.filter(p => p !== product);
            updateProductsList();
        }

        function updateProductsList() {
            const container = document.getElementById('productsContainer');
            const listDiv = document.getElementById('productsList');

            if (selectedProducts.length === 0) {
                listDiv.classList.remove('show');
            } else {
                listDiv.classList.add('show');
                container.innerHTML = selectedProducts.map(product => `
                    <div class="product-item">
                        <span>${product}</span>
                        <button onclick="removeProduct('${product}')" style="background: #e74c3c; padding: 8px 12px; font-size: 12px;">Eliminar</button>
                    </div>
                `).join('');
            }
        }

        async function compareProducts() {
            if (selectedProducts.length === 0) {
                alert('Por favor selecciona al menos un producto');
                return;
            }

            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/api/prices/compare?products=${selectedProducts.join(',')}`);
                const data = await response.json();

                if (data.success) {
                    showResults(data);
                } else {
                    showError(data.error || 'Error en la comparación');
                }
            } catch (error) {
                showError('No se pudo conectar con el servidor. Asegúrate de ejecutar: node server.js');
            } finally {
                document.getElementById('loadingSection').style.display = 'none';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
            document.getElementById('resultsSection').style.display = 'none';
        }

        function showResults(data) {
            const resultsContainer = document.getElementById('resultsContainer');
            const summarySection = document.getElementById('summarySection');

            const supermarketsData = {
                'lider': { name: 'Lider', emoji: '🏪' },
                'jumbo': { name: 'Jumbo', emoji: '🛍️' },
                'santa-isabel': { name: 'Santa Isabel', emoji: '🏬' },
                'unimarc': { name: 'Unimarc', emoji: '🏢' }
            };

            resultsContainer.innerHTML = data.results.map(result => `
                <div class="supermarket-card">
                    <div class="supermarket-header">
                        <div class="supermarket-logo">${supermarketsData[result.supermarket].emoji}</div>
                        <div class="supermarket-name">${supermarketsData[result.supermarket].name}</div>
                    </div>
                    <div class="supermarket-body">
                        ${result.items.map(item => `
                            <div class="price-item">
                                <span class="price-item-name">${item.name}</span>
                                <span class="price-item-value">$${item.price.toLocaleString()}</span>
                            </div>
                        `).join('')}
                        <div class="total-price">
                            <div class="total-price-label">Total</div>
                            <div class="total-price-value">$${result.total.toLocaleString()}</div>
                        </div>
                        ${result.total === data.minTotal ? '<div class="savings-badge best">✓ Mejor Precio</div>' : ''}
                    </div>
                </div>
            `).join('');

            summarySection.innerHTML = `
                <div class="summary-title">📊 Resumen de Comparación</div>
                <div class="summary-item">
                    <span class="summary-item-label">Productos encontrados:</span>
                    <span class="summary-item-value">${data.productsFound}/${selectedProducts.length}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Mejor supermercado:</span>
                    <span class="summary-item-value">${supermarketsData[data.bestSupermarket].emoji} ${supermarketsData[data.bestSupermarket].name}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Ahorro potencial:</span>
                    <span class="summary-item-value">$${data.savings.toLocaleString()}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Precio mínimo total:</span>
                    <span class="summary-item-value">$${data.minTotal.toLocaleString()}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-item-label">Precio máximo total:</span>
                    <span class="summary-item-value">$${data.maxTotal.toLocaleString()}</span>
                </div>
                <div class="recommendation">
                    <span style="margin-right: 10px;">💡</span>
                    <span>Compra en <strong>${supermarketsData[data.bestSupermarket].name}</strong> para ahorrar <strong>$${data.savings.toLocaleString()}</strong></span>
                </div>
            `;

            document.getElementById('resultsSection').style.display = 'block';
            summarySection.classList.add('show');
        }

        document.getElementById('productInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addProduct();
        });

        updateProductsList();
    </script>
</body>
</html>
