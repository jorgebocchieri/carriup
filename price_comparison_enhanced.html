<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carriup — Comparador de Precios Mejorado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 40px; }
        header h1 { font-size: 36px; margin-bottom: 10px; }
        header p { font-size: 18px; opacity: 0.9; }
        .server-info { background: rgba(255, 255, 255, 0.2); color: white; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; text-align: center; }

        .search-section { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .search-section h2 { margin-bottom: 20px; color: #333; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; position: relative; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: all 0.3s ease; }
        input[type="text"]:focus { outline: none; border-color: #FF6600; box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1); }

        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid #FF6600; border-top: none; border-radius: 0 0 8px 8px; max-height: 300px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .search-results.show { display: block; }
        .search-result-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #e0e0e0; transition: background 0.2s; }
        .search-result-item:hover { background: #fff3e0; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-name { font-weight: 600; color: #333; }
        .search-result-category { font-size: 12px; color: #999; }

        button { padding: 12px 24px; background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 102, 0, 0.3); }

        .cart-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        .cart-section h3 { color: #333; margin-bottom: 15px; border-bottom: 2px solid #FF6600; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 8px; margin-bottom: 10px; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; color: #333; }
        .cart-item-qty { font-size: 12px; color: #999; }
        .cart-item-qty input { width: 60px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; }
        .cart-item-remove { background: #e74c3c; padding: 6px 12px; font-size: 12px; border-radius: 4px; }
        .cart-item-remove:hover { background: #c0392b; }

        .compare-btn { width: 100%; margin-top: 15px; padding: 15px; font-size: 16px; }

        .results-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .supermarket-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); transition: all 0.3s ease; }
        .supermarket-card:hover { transform: translateY(-5px); }
        .supermarket-card.best { border: 3px solid #27ae60; }
        .supermarket-header { background: linear-gradient(135deg, #FF6600 0%, #ff8c42 100%); color: white; padding: 20px; text-align: center; }
        .supermarket-card.best .supermarket-header { background: linear-gradient(135deg, #27ae60 0%, #229954 100%); }
        .supermarket-name { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        .supermarket-body { padding: 20px; }
        .price-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e0e0e0; }
        .price-item-name { font-weight: 500; color: #333; font-size: 14px; }
        .price-item-value { font-size: 16px; font-weight: 700; color: #FF6600; }
        .total-price { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
        .total-price-label { font-size: 12px; color: #999; text-transform: uppercase; }
        .total-price-value { font-size: 28px; font-weight: 700; color: #FF6600; }
        .savings-badge { display: inline-block; background: #27ae60; color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-top: 10px; }

        .comparison-summary { background: white; border-radius: 12px; padding: 30px; margin-top: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); display: none; }
        .comparison-summary.show { display: block; }
        .summary-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 20px; }
        .summary-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #e0e0e0; font-size: 16px; }
        .summary-item:last-child { border-bottom: none; }
        .summary-item-label { font-weight: 600; color: #666; }
        .summary-item-value { font-weight: 700; color: #FF6600; }
        .recommendation { background: #e8f8f5; border-left: 4px solid #27ae60; padding: 15px; border-radius: 8px; margin-top: 20px; color: #155724; }

        .loading { text-align: center; padding: 40px; color: white; }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-top: 3px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #f5c6cb; display: none; }
        .error-message.show { display: block; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .modal-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #333; }
        .modal-body { margin-bottom: 20px; }
        .modal-qty-group { margin-bottom: 15px; }
        .modal-qty-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; }
        .modal-qty-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .modal-qty-group input:focus { outline: none; border-color: #FF6600; }
        .modal-footer { display: flex; gap: 10px; }
        .modal-footer button { flex: 1; }
        .modal-footer button:last-child { background: #e0e0e0; color: #333; }
        .modal-footer button:last-child:hover { background: #d0d0d0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Carriup Mejorado</h1>
            <p>Comparador de Precios Inteligente</p>
        </header>

        <div class="server-info">
            ⚙️ Conectado a http://localhost:3001
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="search-section">
            <h2>Busca productos</h2>
            <div class="search-box">
                <input type="text" id="productInput" placeholder="Ej: Leche, Café, Pan..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
                <button onclick="addToCart()">Agregar al Carrito</button>
            </div>
        </div>

        <div class="cart-section" id="cartSection" style="display: none;">
            <h3>📦 Mi Carrito</h3>
            <div id="cartItems"></div>
            <button class="compare-btn" onclick="compareProducts()">Comparar Precios</button>
        </div>

        <div id="resultsSection" style="display: none;">
            <div class="results-section" id="resultsContainer"></div>
            <div class="comparison-summary" id="summarySection"></div>
        </div>

        <div id="loadingSection" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Comparando precios en supermercados...</p>
            </div>
        </div>
    </div>

    <!-- Modal para seleccionar cantidad -->
    <div class="modal" id="qtyModal">
        <div class="modal-content">
            <div class="modal-header">Seleccionar Cantidad</div>
            <div class="modal-body">
                <div id="productDetails"></div>
                <div class="modal-qty-group">
                    <label for="qtyInput">Cantidad:</label>
                    <input type="number" id="qtyInput" value="1" min="1" step="1">
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="confirmQty()">Confirmar</button>
                <button onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';
        let allProducts = [];
        let cart = [];
        let selectedProduct = null;

        // Cargar productos disponibles
        async function loadProducts() {
            try {
                allProducts = [
                    { id: 'leche', name: 'Leche', category: 'Lácteos' },
                    { id: 'cafe', name: 'Café', category: 'Bebidas' },
                    { id: 'pan_integral', name: 'Pan Integral', category: 'Panadería' },
                    { id: 'huevos', name: 'Huevos', category: 'Proteínas' },
                    { id: 'arroz', name: 'Arroz', category: 'Granos' },
                    { id: 'aceite', name: 'Aceite', category: 'Condimentos' },
                    { id: 'azucar', name: 'Azúcar', category: 'Condimentos' },
                    { id: 'harina', name: 'Harina', category: 'Granos' },
                    { id: 'queso', name: 'Queso', category: 'Lácteos' },
                    { id: 'yogur', name: 'Yogur', category: 'Lácteos' },
                    { id: 'mantequilla', name: 'Mantequilla', category: 'Lácteos' },
                    { id: 'jambon', name: 'Jamón', category: 'Proteínas' },
                    { id: 'pollo', name: 'Pechuga de Pollo', category: 'Proteínas' },
                    { id: 'carne', name: 'Carne Molida', category: 'Proteínas' },
                    { id: 'salmon', name: 'Salmón', category: 'Proteínas' },
                    { id: 'papas', name: 'Papas', category: 'Verduras' },
                    { id: 'zanahorias', name: 'Zanahorias', category: 'Verduras' },
                    { id: 'tomates', name: 'Tomates', category: 'Verduras' },
                    { id: 'lechuga', name: 'Lechuga', category: 'Verduras' },
                    { id: 'cebolla', name: 'Cebolla', category: 'Verduras' },
                    { id: 'manzanas', name: 'Manzanas', category: 'Frutas' },
                    { id: 'platanos', name: 'Plátanos', category: 'Frutas' },
                    { id: 'naranjas', name: 'Naranjas', category: 'Frutas' },
                    { id: 'fresas', name: 'Fresas', category: 'Frutas' },
                    { id: 'uvas', name: 'Uvas', category: 'Frutas' }
                ];
            } catch (error) {
                console.error('Error cargando productos:', error);
            }
        }

        // Buscar productos mientras el usuario escribe
        document.getElementById('productInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');

            if (query.length === 0) {
                resultsDiv.classList.remove('show');
                return;
            }

            const filtered = allProducts.filter(p =>
                p.name.toLowerCase().includes(query) ||
                p.id.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="search-result-item" style="color: #999;">No se encontraron productos</div>';
                resultsDiv.classList.add('show');
                return;
            }

            resultsDiv.innerHTML = filtered.map(p => `
                <div class="search-result-item" onclick="selectProduct('${p.id}', '${p.name}', '${p.category}')">
                    <div class="search-result-name">${p.name}</div>
                    <div class="search-result-category">${p.category}</div>
                </div>
            `).join('');
            resultsDiv.classList.add('show');
        });

        // Seleccionar producto y mostrar detalles con marcas
        async function selectProduct(id, name, category) {
            selectedProduct = { id, name, category };
            document.getElementById('productInput').value = name;
            document.getElementById('searchResults').classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/api/products/details?id=${id}`);
                const data = await response.json();

                if (data.success) {
                    const brands = data.brands || [];
                    const varieties = data.varieties || [];

                    let brandsHTML = '';
                    if (brands.length > 0) {
                        brandsHTML = `
                            <div style="margin-bottom: 15px;">
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">Marcas disponibles:</label>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
                                    ${brands.map(brand => `
                                        <button onclick="selectBrand('${brand}')" style="padding: 8px 12px; background: #f0f0f0; color: #333; border: 2px solid #e0e0e0; font-size: 13px;" id="brand-${brand}">
                                            ${brand}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `;

                        if (varieties.length > 0) {
                            brandsHTML += `
                                <div style="margin-bottom: 15px; padding: 12px; background: #f9f9f9; border-radius: 8px;">
                                    <strong style="font-size: 12px; color: #666;">Precios por marca:</strong>
                                    <div style="font-size: 12px; color: #999; margin-top: 8px;">
                                        ${varieties.map(v => `<div>${v.brand} (${v.supermarket}): $${v.price.toLocaleString()}</div>`).join('')}
                                    </div>
                                </div>
                            `;
                        }
                    }

                    document.getElementById('productDetails').innerHTML = `
                        <div style="margin-bottom: 15px;">
                            <strong style="font-size: 16px;">${name}</strong><br>
                            <span style="color: #999; font-size: 13px;">${category}</span>
                        </div>
                        ${brandsHTML}
                    `;

                    document.getElementById('qtyModal').classList.add('show');
                }
            } catch (error) {
                console.error('Error cargando detalles:', error);
                document.getElementById('productDetails').innerHTML = `
                    <div style="margin-bottom: 15px;">
                        <strong>${name}</strong><br>
                        <span style="color: #999; font-size: 14px;">${category}</span>
                    </div>
                `;
                document.getElementById('qtyModal').classList.add('show');
            }
        }

        function selectBrand(brand) {
            selectedProduct.brand = brand;
            // Highlight selected brand
            document.querySelectorAll('[id^="brand-"]').forEach(btn => {
                btn.style.borderColor = '#e0e0e0';
                btn.style.background = '#f0f0f0';
            });
            document.getElementById(`brand-${brand}`).style.borderColor = '#FF6600';
            document.getElementById(`brand-${brand}`).style.background = '#fff3e0';
        }

        function closeModal() {
            document.getElementById('qtyModal').classList.remove('show');
            selectedProduct = null;
        }

        function confirmQty() {
            const qty = parseInt(document.getElementById('qtyInput').value);
            if (qty < 1) {
                alert('Ingresa una cantidad válida');
                return;
            }

            if (selectedProduct) {
                const existing = cart.find(item => item.id === selectedProduct.id);
                if (existing) {
                    existing.quantity += qty;
                } else {
                    cart.push({ ...selectedProduct, quantity: qty });
                }
                updateCartDisplay();
                document.getElementById('productInput').value = '';
                closeModal();
            }
        }

        function updateCartDisplay() {
            const cartSection = document.getElementById('cartSection');
            const cartItems = document.getElementById('cartItems');

            if (cart.length === 0) {
                cartSection.style.display = 'none';
                return;
            }

            cartSection.style.display = 'block';
            cartItems.innerHTML = cart.map((item, idx) => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-qty">
                            Cantidad:
                            <input type="number" value="${item.quantity}" min="1"
                                onchange="updateQty(${idx}, this.value)">
                        </div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${idx})">Eliminar</button>
                </div>
            `).join('');
        }

        function updateQty(idx, value) {
            const qty = parseInt(value);
            if (qty > 0) {
                cart[idx].quantity = qty;
                updateCartDisplay();
            }
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCartDisplay();
        }

        function addToCart() {
            if (!selectedProduct && document.getElementById('productInput').value.trim() === '') {
                showError('Selecciona un producto primero');
                return;
            }
        }

        async function compareProducts() {
            if (cart.length === 0) {
                showError('Agrega productos al carrito');
                return;
            }

            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';

            try {
                const productNames = cart.map(item => item.id).join(',');
                const response = await fetch(`${API_URL}/api/prices/compare?products=${productNames}`);
                const data = await response.json();

                if (!data.success) {
                    showError(data.error || 'Error al comparar precios');
                    document.getElementById('loadingSection').style.display = 'none';
                    return;
                }

                displayResults(data);
            } catch (error) {
                showError('Error conectando con el servidor: ' + error.message);
                document.getElementById('loadingSection').style.display = 'none';
            }
        }

        function displayResults(data) {
            const resultsContainer = document.getElementById('resultsContainer');
            const summarySection = document.getElementById('summarySection');

            resultsContainer.innerHTML = data.results.map(result => {
                const isBest = result.supermarket === data.bestSupermarket;
                return `
                    <div class="supermarket-card ${isBest ? 'best' : ''}">
                        <div class="supermarket-header">
                            <div class="supermarket-name">${result.supermarket.toUpperCase()}</div>
                        </div>
                        <div class="supermarket-body">
                            ${result.items.map(item => `
                                <div class="price-item">
                                    <div class="price-item-name">${item.name}</div>
                                    <div class="price-item-value">$${item.price.toLocaleString()}</div>
                                </div>
                            `).join('')}
                            <div class="total-price">
                                <div class="total-price-label">Total</div>
                                <div class="total-price-value">$${result.total.toLocaleString()}</div>
                                ${isBest ? '<div class="savings-badge">✓ MEJOR OPCIÓN</div>' : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            summarySection.innerHTML = `
                <div class="summary-title">📊 Resumen de Comparación</div>
                <div class="summary-item">
                    <div class="summary-item-label">Mejor Opción:</div>
                    <div class="summary-item-value">${data.bestSupermarket.toUpperCase()}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-item-label">Precio Mínimo:</div>
                    <div class="summary-item-value">$${data.minTotal.toLocaleString()}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-item-label">Precio Máximo:</div>
                    <div class="summary-item-value">$${data.maxTotal.toLocaleString()}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-item-label">Ahorro Potencial:</div>
                    <div class="summary-item-value" style="color: #27ae60;">$${data.savings.toLocaleString()}</div>
                </div>
                <div class="recommendation">
                    💡 Te recomendamos comprar en <strong>${data.bestSupermarket.toUpperCase()}</strong> para ahorrar <strong>$${data.savings.toLocaleString()}</strong>
                </div>
            `;

            summarySection.classList.add('show');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('loadingSection').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        // Cerrar modal al presionar Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Cargar productos al iniciar
        loadProducts();
    </script>
</body>
</html>
